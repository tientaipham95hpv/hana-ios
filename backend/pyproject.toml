[project]
name = "hana-backend"
version = "0.1.0"
description = "Hana local backend and turn pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5.1,<7",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "structlog>=24.4,<26",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the local Postgres and Redis services",
  "live_9router: requires an explicitly configured live 9Router",
  "live_voice: requires opt-in paid Deepgram and ElevenLabs credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
  # FastAPI dependency declarations intentionally call Depends/Form/File.
  "B008",
  # Formatting is delegated to Ruff's formatter; readability wins over hard wrapping URLs/schema.
  "E501",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
